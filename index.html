
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행운의 로또 추첨기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f5fa;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }

    .container {
      width: 95%;
      max-width: 550px;
      padding: 35px 20px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 { color: #24314c; }
    p { color: #777; }

    .lotto-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 14px 0;
      padding: 10px;
      border-radius: 12px;
      background: #f8f9fb;
    }

    .game-label {
      width: 25px;
      font-weight: bold;
      color: #555;
    }

    .balls {
      display: flex;
      flex: 1;
      justify-content: space-evenly;
      gap: 5px;
    }

    .ball {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: white;
      background: #bbb;
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.12);
    }

    .yellow { background: #e5b32f; }
    .blue { background: #3b8dce; }
    .red { background: #d9534f; }
    .gray { background: #777f8a; }
    .green { background: #49a582; }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #f07825;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #d96314; }

    #count {
      margin-top: 20px;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 450px) {
      .container { padding: 25px 10px; }
      .lotto-row { gap: 4px; padding: 8px 4px; }
      .balls { gap: 3px; }
      .ball {
        width: 36px;
        height: 36px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍀 행운의 로또 추첨기</h1>
    <p>한 번에 5게임을 추첨해 보세요!</p>

    <div id="lotto-results"></div>

    <button onclick="drawLotto()">
      🎲 로또 번호 5게임 추첨하기
    </button>

    <div id="count">아직 추첨하지 않았습니다.</div>
  </div>

  <script>
    let drawCount = 0;

    // 페이지를 열면 빈 번호 5줄 표시
    const results = document.getElementById("lotto-results");

    function getColor(num) {
      if (num <= 10) return "yellow";
      if (num <= 20) return "blue";
      if (num <= 30) return "red";
      if (num <= 40) return "gray";
      return "green";
    }

    function createRow(label, numbers) {
      const row = document.createElement("div");
      row.className = "lotto-row";

      const gameLabel = document.createElement("span");
      gameLabel.className = "game-label";
      gameLabel.textContent = label;
      row.appendChild(gameLabel);

      const balls = document.createElement("div");
      balls.className = "balls";

      numbers.forEach(num => {
        const ball = document.createElement("div");
        ball.className = "ball";

        if (typeof num === "number") {
          ball.classList.add(getColor(num));
        }
        ball.textContent = num;
        balls.appendChild(ball);
      });

      row.appendChild(balls);
      results.appendChild(row);
    }

    function drawLotto() {
      results.innerHTML = "";

      // 5게임 추첨
      for (let game = 0; game < 5; game++) {
        const numbers = Array.from(
          { length: 45 },
          (_, i) => i + 1
        );

        // Fisher-Yates 방식으로 숫자 섞기
        for (let i = numbers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [numbers[i], numbers[j]] =
            [numbers[j], numbers[i]];
        }

        const selected = numbers
          .slice(0, 6)
          .sort((a, b) => a - b);

        const label = String.fromCharCode(65 + game);
        createRow(label, selected);
      }

      drawCount++;
      document.getElementById("count").textContent =
        `총 ${drawCount}회 추첨했습니다.`;
    }

    // 최초 화면
    for (let i = 0; i < 5; i++) {
      createRow(
        String.fromCharCode(65 + i),
        ["?", "?", "?", "?", "?", "?"]
      );
    }
  </script>

</body>
</html>
