
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행운의 로또 추첨기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f5fa;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }

    .container {
      width: 95%;
      max-width: 550px;
      padding: 35px 20px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 { color: #24314c; }
    p { color: #777; }

    .lotto-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 14px 0;
      padding: 10px;
      border-radius: 12px;
      background: #f8f9fb;
    }

    .game-label {
      width: 25px;
      font-weight: bold;
      color: #555;
    }

    .balls {
      display: flex;
      flex: 1;
      justify-content: space-evenly;
      gap: 5px;
    }

    .ball {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: white;
      background: #bbb;
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.12);
    }

    .yellow { background: #e5b32f; }
    .blue { background: #3b8dce; }
    .red { background: #d9534f; }
    .gray { background: #777f8a; }
    .green { background: #49a582; }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #f07825;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #d96314; }

    #count {
      margin-top: 20px;
      color: #999;
      font-size: 13px;
    }

    .contact { margin-top: 32px; padding-top: 24px; border-top: 1px solid #e5e9f0; text-align: left; }
    .contact h2 { margin: 0 0 8px; color: #24314c; font-size: 22px; }
    .contact p { line-height: 1.6; font-size: 14px; }
    .contact label { display: block; margin-top: 16px; color: #24314c; font-size: 14px; font-weight: bold; }
    .contact input, .contact textarea { display: block; width: 100%; margin-top: 7px; padding: 12px; border: 1px solid #cbd3df; border-radius: 8px; background: #fff; color: #24314c; font: inherit; font-size: 16px; }
    .contact textarea { min-height: 130px; resize: vertical; }
    .contact input:focus-visible, .contact textarea:focus-visible, button:focus-visible { outline: 3px solid #3b8dce; outline-offset: 3px; }
    .contact .optional { color: #777; font-weight: normal; }
    .contact .privacy { font-size: 12px; }
    .contact button:disabled { opacity: .65; cursor: wait; }
    #contact-status { margin-bottom: 0; color: #24314c; }

    .comments { margin-top: 32px; padding-top: 24px; border-top: 1px solid #e5e9f0; text-align: left; }
    .comments h2 { margin: 0 0 16px; color: #24314c; font-size: 22px; }
    #disqus_thread { width: 100%; }

    @media (max-width: 450px) {
      .container { padding: 25px 10px; }
      .lotto-row { gap: 4px; padding: 8px 4px; }
      .balls { gap: 3px; }
      .ball {
        width: 36px;
        height: 36px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍀 행운의 로또 추첨기</h1>
    <p><a href="animal.html" style="color: #315a42; font-weight: bold;">🐾 나는 어떤 동물상일까? 사진으로 알아보기 →</a></p>
    <p>한 번에 5게임을 추첨해 보세요!</p>

    <div id="lotto-results"></div>

    <button onclick="drawLotto()">
      🎲 로또 번호 5게임 추첨하기
    </button>

    <div id="count">아직 추첨하지 않았습니다.</div>

    <section class="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">제휴문의</h2>
      <p>함께할 좋은 아이디어가 있으신가요? 문의를 남겨주시면 이메일로 답변드리겠습니다.</p>
      <form id="contact-form" action="https://formspree.io/f/maeekzrd" method="POST">
        <label for="contact-name">이름 / 담당자명</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" maxlength="100" required>
        <label for="contact-email">이메일</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="contact-company">회사 / 브랜드 <span class="optional">(선택)</span></label>
        <input id="contact-company" name="company" type="text" autocomplete="organization" maxlength="150">
        <label for="contact-message">문의 내용</label>
        <textarea id="contact-message" name="message" placeholder="제휴 제안이나 궁금한 내용을 알려주세요." maxlength="5000" required></textarea>
        <p class="privacy">입력하신 정보는 제휴문의 확인 및 답변을 위해 Formspree로 전송됩니다.</p>
        <button type="submit" id="contact-submit">제휴문의 보내기</button>
        <p id="contact-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="comments" aria-labelledby="comments-title">
      <h2 id="comments-title">댓글</h2>
      <div id="disqus_thread"></div>
      <noscript>댓글을 보려면 JavaScript를 활성화해 주세요. <a href="https://disqus.com/?ref_noscript">Disqus 댓글 서비스</a></noscript>
    </section>
  </div>

  <script>
    const contactForm = document.getElementById("contact-form");
    const contactButton = document.getElementById("contact-submit");
    const contactStatus = document.getElementById("contact-status");

    contactForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (contactButton.disabled) return;
      contactButton.disabled = true;
      contactButton.textContent = "보내는 중…";
      contactStatus.textContent = "";
      try {
        const response = await fetch(contactForm.action, {
          method: "POST",
          body: new FormData(contactForm),
          headers: { Accept: "application/json" }
        });
        if (!response.ok) throw new Error("Submission failed");
        contactForm.reset();
        contactStatus.textContent = "문의가 접수되었습니다. 남겨주신 이메일로 답변드리겠습니다.";
      } catch (error) {
        contactStatus.textContent = "문의를 보내지 못했습니다. 잠시 후 다시 시도해 주세요. 입력하신 내용은 유지됩니다.";
      } finally {
        contactButton.disabled = false;
        contactButton.textContent = "제휴문의 보내기";
      }
    });

    let drawCount = 0;

    // 페이지를 열면 빈 번호 5줄 표시
    const results = document.getElementById("lotto-results");

    function getColor(num) {
      if (num <= 10) return "yellow";
      if (num <= 20) return "blue";
      if (num <= 30) return "red";
      if (num <= 40) return "gray";
      return "green";
    }

    function createRow(label, numbers) {
      const row = document.createElement("div");
      row.className = "lotto-row";

      const gameLabel = document.createElement("span");
      gameLabel.className = "game-label";
      gameLabel.textContent = label;
      row.appendChild(gameLabel);

      const balls = document.createElement("div");
      balls.className = "balls";

      numbers.forEach(num => {
        const ball = document.createElement("div");
        ball.className = "ball";

        if (typeof num === "number") {
          ball.classList.add(getColor(num));
        }
        ball.textContent = num;
        balls.appendChild(ball);
      });

      row.appendChild(balls);
      results.appendChild(row);
    }

    function drawLotto() {
      results.innerHTML = "";

      // 5게임 추첨
      for (let game = 0; game < 5; game++) {
        const numbers = Array.from(
          { length: 45 },
          (_, i) => i + 1
        );

        // Fisher-Yates 방식으로 숫자 섞기
        for (let i = numbers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [numbers[i], numbers[j]] =
            [numbers[j], numbers[i]];
        }

        const selected = numbers
          .slice(0, 6)
          .sort((a, b) => a - b);

        const label = String.fromCharCode(65 + game);
        createRow(label, selected);
      }

      drawCount++;
      document.getElementById("count").textContent =
        `총 ${drawCount}회 추첨했습니다.`;
    }

    // 최초 화면
    for (let i = 0; i < 5; i++) {
      createRow(
        String.fromCharCode(65 + i),
        ["?", "?", "?", "?", "?", "?"]
      );
    }
  </script>

  <script>
    var disqus_config = function () {
      this.page.url = 'https://jocoding-test-ceo.pages.dev/';
      this.page.identifier = 'lotto-home';
      this.language = 'ko';
    };

    (function () {
      var d = document, s = d.createElement('script');
      s.src = 'https://rsoul.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
    })();
  </script>
</body>
</html>
